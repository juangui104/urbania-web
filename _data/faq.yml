- q: "¿Cómo es el proceso, desde el primer contacto hasta la entrega?"
  a: "Son seis pasos: (1) reunión inicial, sin compromiso, donde nos contás qué querés hacer; (2) cotización con alcance, materiales y precio; (3) diseños y renders, si tu proyecto los requiere; (4) contrato; (5) ejecución, con reportes visuales del avance; y (6) entrega del espacio terminado."
- q: "¿Qué necesito para pedir una propuesta?"
  a: "Solo contarnos qué querés hacer, dónde está el inmueble y, si los tenés, enviarnos fotos, planos o referencias. Con eso agendamos la reunión inicial y definimos el alcance."
- q: "¿La reunión inicial tiene costo?"
  a: "No. Es una conversación sin compromiso para entender qué querés hacer, ver el espacio y definir el alcance."
- q: "¿Cuánto cuesta mi proyecto?"
  a: "Cada proyecto es distinto y el valor depende de muchas variables: el alcance, el estado del inmueble, los materiales y los acabados que elijas. Por eso no manejamos precios generales: después de conocer tu proyecto te entregamos una propuesta con alcance, materiales y precio real."
- q: "¿El precio puede cambiar durante la obra?"
  a: "No. Firmamos un contrato a precio fijo que cubre el alcance acordado. Si durante la obra pedís un trabajo adicional o un cambio de especificación, se cotiza por separado y se aprueba antes de ejecutarlo."
- q: "¿Quién se encarga de los proveedores, los materiales y el personal?"
  a: "Nosotros. Nos encargamos de la gestión, los proveedores, los tiempos y la calidad técnica de la obra; vos solo tomás las decisiones que importan."
- q: "¿Cómo sigo el avance si no puedo estar en la obra?"
  a: "Te enviamos reportes visuales del avance durante la ejecución, para que estés tranquilo sin tener que ir a obra todos los días."
- q: "¿Quién solicita los permisos y licencias?"
  a: "Nosotros tramitamos todos los permisos y licencias requeridos por la ley para tu proyecto."
